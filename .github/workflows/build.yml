              @State private var fromDay = 0
              @State private var toDay = 1
              @State private var target = ""
              @State private var pendingText = ""
              @State private var pendingRun: (() -> Void)?

              var isT: Bool { kind == "T" }
              var ownerKey: String { isT ? sel : skey(sel) }
              func key(of opt: String) -> String { isT ? opt : skey(opt) }
              var options: [PickOpt] {
                  if isT { return store.data.teachers.filter(\.active).map { PickOpt(id: $0.id.uuidString, label: $0.name) } }
                  return store.data.groupList.filter(\.active)
                      .sorted { $0.name.localizedStandardCompare($1.name) == .orderedAscending }
                      .map { PickOpt(id: $0.name, label: $0.name) }
              }
              func ownerName(_ opt: String) -> String { options.first { $0.id == opt }?.label ?? opt }

              func classText(_ day: Int, _ p: Int) -> String? {
                  if isT {
                      guard let l = store.data.lessons.first(where: { $0.teacherID.uuidString == sel && $0.day == day && $0.period == p }) else { return nil }
                      return "\(l.subject) · \(l.group)"
                  }
                  guard let l = store.data.lessons.first(where: { skey($0.group) == skey(sel) && $0.day == day && $0.period == p }) else { return nil }
                  return "\(l.subject) · \(store.name(l.teacherID))"
              }
              func change(_ text: String, _ run: @escaping (inout AppData) -> Void) {
                  pendingText = text
                  pendingRun = { var d = store.data; run(&d); store.data = d }
              }
              func cellBinding(_ day: Int, _ p: Int) -> Binding<AvailState> {
                  let k = kind, ok = ownerKey
                  return Binding(get: { stateOf(store.data.availIndex, k, ok, day, p) },
                                 set: { v in var d = store.data; setAvail(&d, kind: k, owner: ok, day: day, period: p, state: v); store.data = d })
              }
              func cell(_ day: Int, _ p: PeriodInfo, _ idx: [String: AvailState]) -> some View {
                  let st = stateOf(idx, kind, ownerKey, day, p.id)
                  return VStack(alignment: .leading, spacing: 2) {
                      Picker("", selection: cellBinding(day, p.id)) {
                          ForEach(AvailState.allCases) { Text($0.rawValue).tag($0) }
                      }.labelsHidden().pickerStyle(.menu)
                      if let c = classText(day, p.id) { Text(c).font(.caption2).foregroundStyle(.secondary).lineLimit(2) }
                  }
                  .padding(4).frame(width: 140, alignment: .leading)
                  .background(st.color.opacity(0.3)).cornerRadius(6)
              }

              func applyBulk() {
                  let st = bulkState, ds = days.sorted(), ps = periodsSel.sorted(), k = kind, ok = ownerKey
                  change("Se cambiarán \(ds.count * ps.count) celdas de \(ownerName(sel)) a «\(st.rawValue)». Las clases originales no se modifican. ¿Continuar?") { d in
                      for dd in ds { for pp in ps { setAvail(&d, kind: k, owner: ok, day: dd, period: pp, state: st) } }
                  }
              }
              func copyDay() {
                  let a = fromDay, b = toDay, k = kind, ok = ownerKey
                  let idx = store.data.availIndex, pids = store.data.periods.map(\.id)
                  change("Se copiará la configuración de \(dayNames[a]) a \(dayNames[b]) para \(ownerName(sel)). ¿Continuar?") { d in
                      for p in pids { setAvail(&d, kind: k, owner: ok, day: b, period: p, state: stateOf(idx, k, ok, a, p)) }
                  }
              }
              func copyOwner() {
                  let src = ownerKey, tk = key(of: target), k = kind
                  change("Se copiará toda la configuración de \(ownerName(sel)) a \(ownerName(target)), reemplazando la que tenga. ¿Continuar?") { d in
                      let entries = d.availability.filter { $0.kind == k && $0.owner == src }
                      d.availability.removeAll { $0.kind == k && $0.owner == tk }
                      for e in entries { var n = e; n.owner = tk; n.modified = Date(); d.availability.append(n) }
                  }
