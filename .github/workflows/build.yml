name: Compilar app para Mac
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - name: Crear proyecto (todo el código va en este archivo)
        run: |
          mkdir -p Sources/HorariosEmergencia
          cat > Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "HorariosEmergencia",
              platforms: [.macOS(.v14)],
              targets: [
                  .executableTarget(name: "HorariosEmergencia", path: "Sources/HorariosEmergencia")
              ]
          )
          EOF
          cat > Sources/HorariosEmergencia/HorariosApp.swift <<'EOF'
          import SwiftUI

          @main
          struct HorariosApp: App {
              @StateObject private var store = Store()
              var body: some Scene {
                  WindowGroup("Horarios de Emergencia") {
                      ContentView()
                          .environmentObject(store)
                          .frame(minWidth: 1000, minHeight: 640)
                  }
              }
          }

          enum Pantalla: String, CaseIterable, Identifiable {
              case inicio = "Inicio"
              case importar = "Importar horarios"
              case docentes = "Docentes"
              case horario = "Horario institucional"
              case config = "Configuración académica"
              case emergencia = "Ausencias y emergencia"
              case consultar = "Consultar horarios"
              case informes = "Informes y exportaciones"
              case historial = "Historial"
              case estGrupos = "Configuración de grupos"
              case estAreas = "Configuración de áreas"
              case estAsignaturas = "Configuración de asignaturas"
              case estDocentes = "Configuración de docentes"
              case asocAsignaturas = "Docentes y asignaturas"
              case asocGrupos = "Docentes y grupos"
              case dispDocentes = "Configurar disponibilidad docente"
              case dispGrupos = "Configurar disponibilidad de grupos"
              case dispPanel = "Panel de disponibilidad"
              var id: String { rawValue }
              var isDisponibilidad: Bool { self == .dispDocentes || self == .dispGrupos || self == .dispPanel }
              var isEstructura: Bool {
                  switch self {
                  case .estGrupos, .estAreas, .estAsignaturas, .estDocentes, .asocAsignaturas, .asocGrupos: return true
                  default: return false
                  }
              }
              var icon: String {
                  switch self {
                  case .inicio: return "house"
                  case .importar: return "square.and.arrow.down"
                  case .docentes: return "person.2"
                  case .horario: return "tablecells"
                  case .config: return "gearshape"
                  case .emergencia: return "exclamationmark.triangle"
                  case .consultar: return "calendar"
                  case .informes: return "doc.text"
                  case .historial: return "clock.arrow.circlepath"
                  case .estGrupos: return "rectangle.3.group"
                  case .estAreas: return "square.grid.2x2"
                  case .estAsignaturas: return "books.vertical"
                  case .estDocentes: return "person.crop.rectangle.stack"
                  case .asocAsignaturas: return "link"
                  case .asocGrupos: return "person.3"
                  case .dispDocentes: return "clock"
                  case .dispGrupos: return "calendar.badge.clock"
                  case .dispPanel: return "list.bullet.rectangle"
                  }
              }
          }

          struct ContentView: View {
              @State private var sel: Pantalla? = .inicio
              var body: some View {
                  NavigationSplitView {
                      List(selection: $sel) {
                          Section("Menú principal") {
                              ForEach(Pantalla.allCases.filter { !$0.isEstructura && !$0.isDisponibilidad }) { p in
                                  Label(p.rawValue, systemImage: p.icon).tag(p)
                              }
                          }
                          Section("Estructura institucional") {
                              ForEach(Pantalla.allCases.filter { $0.isEstructura }) { p in
                                  Label(p.rawValue, systemImage: p.icon).tag(p)
                              }
                          }
                          Section("Disponibilidad de períodos") {
                              ForEach(Pantalla.allCases.filter { $0.isDisponibilidad }) { p in
                                  Label(p.rawValue, systemImage: p.icon).tag(p)
                              }
                          }
                      }
                      .navigationSplitViewColumnWidth(min: 230, ideal: 260)
                  } detail: {
                      switch sel ?? .inicio {
                      case .inicio: InicioView()
                      case .importar: ImportView()
                      case .docentes: TeachersView()
                      case .horario: LessonsView()
                      case .config: ConfigView()
                      case .emergencia: EmergencyView()
                      case .consultar: ConsultView()
                      case .informes: ReportsView()
                      case .historial: HistoryView()
                      case .estGrupos: GroupsConfigView()
                      case .estAreas: AreasConfigView()
                      case .estAsignaturas: SubjectsConfigView()
                      case .estDocentes: TeachersConfigView()
                      case .asocAsignaturas: AssocView(bySubject: true)
                      case .asocGrupos: AssocView(bySubject: false)
                      case .dispDocentes: AvailabilityConfigView(kind: "T")
                      case .dispGrupos: AvailabilityConfigView(kind: "G")
                      case .dispPanel: AvailabilityScreen()
                      }
                  }
              }
          }
          EOF
          cat > Sources/HorariosEmergencia/Models.swift <<'EOF'
          import Foundation

          let dayNames = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"]

          /// Clave de comparación: sin tildes, mayúsculas, sin espacios (conserva "-" para grupos como 6-1).
          func skey(_ s: String) -> String {
              let k = s.folding(options: [.diacriticInsensitive, .caseInsensitive], locale: nil)
                  .filter { $0.isLetter || $0.isNumber || $0 == "-" }.uppercased()
              return k == "EDUFISICA" ? "EDUCACIONFISICA" : k
          }

          struct Teacher: Identifiable, Codable, Hashable {
              var id = UUID()
              var name: String
              var area: String = ""
              var internalID: String = ""
              var areaNames: [String] = []
              var subjectNames: [String] = []
              var groupNames: [String] = []
              var shift: String = "AM"
              var unavailable: [String] = []      // "día|período" en que NO está disponible
              var active: Bool = true
              enum CodingKeys: String, CodingKey {
                  case id, name, area, internalID, areaNames, subjectNames, groupNames, shift, unavailable, active
              }
          }

          extension Teacher {
              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  let n = try c.decode(String.self, forKey: .name)
                  self.init(name: n)
                  id = try c.decodeIfPresent(UUID.self, forKey: .id) ?? UUID()
                  area = try c.decodeIfPresent(String.self, forKey: .area) ?? ""
                  internalID = try c.decodeIfPresent(String.self, forKey: .internalID) ?? ""
                  areaNames = try c.decodeIfPresent([String].self, forKey: .areaNames) ?? []
                  subjectNames = try c.decodeIfPresent([String].self, forKey: .subjectNames) ?? []
                  groupNames = try c.decodeIfPresent([String].self, forKey: .groupNames) ?? []
                  shift = try c.decodeIfPresent(String.self, forKey: .shift) ?? "AM"
                  unavailable = try c.decodeIfPresent([String].self, forKey: .unavailable) ?? []
                  active = try c.decodeIfPresent(Bool.self, forKey: .active) ?? true
              }
          }

          enum AvailState: String, Codable, CaseIterable, Identifiable {
              case available = "Disponible"
              case free = "Libre"
              case restricted = "Restringida"
              var id: String { rawValue }
          }

          /// Estado de un período para un docente ("T") o un grupo ("G"). Sin entrada = Disponible.
          struct AvailEntry: Codable, Hashable {
              var kind: String
              var owner: String      // UUID del docente o clave (skey) del grupo
              var day: Int
              var period: Int
              var state: AvailState
              var modified: Date
          }

          struct SchoolGroup: Identifiable, Codable, Hashable {
              var id = UUID()
              var name: String
              var grade: String = ""
              var active: Bool = true
              var effGrade: String { grade.isEmpty ? gradeOf(name) : grade }
          }

          struct Area: Identifiable, Codable, Hashable {
              var id = UUID()
              var name: String
              var active: Bool = true
          }

          struct Subject: Identifiable, Codable, Hashable {
              var id = UUID()
              var name: String
              var areaID: UUID? = nil
              var active: Bool = true
          }

          struct Lesson: Identifiable, Codable, Hashable {
              var id = UUID()
              var group: String
              var day: Int          // 0 = lunes ... 4 = viernes
              var period: Int       // 1...N
              var subject: String
              var teacherID: UUID
          }

          struct Assignment: Identifiable, Codable, Hashable {
              var id = UUID()
              var group: String
              var period: Int
              var subject: String
              var absentTeacherID: UUID
              var coverTeacherID: UUID?
              var fromPeriod: Int? = nil      // si la clase fue movida desde otro período
          }

          struct EmergencyRecord: Identifiable, Codable {
              var id = UUID()
              var date: Date
              var day: Int
              var absentIDs: [UUID]
              var assignments: [Assignment]
          }

          struct PeriodInfo: Identifiable, Codable, Hashable {
              var id: Int
              var time: String
          }

          struct AppData: Codable {
              var teachers: [Teacher] = []
              var lessons: [Lesson] = []
              var periods: [PeriodInfo] = [
                  PeriodInfo(id: 1, time: "6:30 – 7:25"),
                  PeriodInfo(id: 2, time: "7:25 – 8:20"),
                  PeriodInfo(id: 3, time: "8:20 – 9:15"),
                  PeriodInfo(id: 4, time: "9:15 – 10:10"),
                  PeriodInfo(id: 5, time: "10:30 – 11:25"),
                  PeriodInfo(id: 6, time: "11:25 – 12:20")
              ]
              var breakTime: String = "10:10 – 10:30"
              var history: [EmergencyRecord] = []
              var groupList: [SchoolGroup] = []
              var areaList: [Area] = []
              var subjectList: [Subject] = []
              var availability: [AvailEntry] = []
              enum CodingKeys: String, CodingKey {
                  case teachers, lessons, periods, breakTime, history, groupList, areaList, subjectList, availability
              }
          }

          extension AppData {
              /// Compatible con archivos guardados por versiones anteriores (campos nuevos opcionales).
              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.init()
                  teachers = try c.decodeIfPresent([Teacher].self, forKey: .teachers) ?? []
                  lessons = try c.decodeIfPresent([Lesson].self, forKey: .lessons) ?? []
                  if let p = try c.decodeIfPresent([PeriodInfo].self, forKey: .periods) { periods = p }
                  if let b = try c.decodeIfPresent(String.self, forKey: .breakTime) { breakTime = b }
                  history = try c.decodeIfPresent([EmergencyRecord].self, forKey: .history) ?? []
                  groupList = try c.decodeIfPresent([SchoolGroup].self, forKey: .groupList) ?? []
                  areaList = try c.decodeIfPresent([Area].self, forKey: .areaList) ?? []
                  subjectList = try c.decodeIfPresent([Subject].self, forKey: .subjectList) ?? []
                  availability = try c.decodeIfPresent([AvailEntry].self, forKey: .availability) ?? []
              }
          }
          EOF
          cat > Sources/HorariosEmergencia/Store.swift <<'EOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class Store: ObservableObject {
              @Published var data = AppData() { didSet { save() } }
              private let folder: URL
              private var fileURL: URL { folder.appendingPathComponent("datos.json") }

              init() {
                  let base = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0]
                  folder = base.appendingPathComponent("HorariosEmergencia", isDirectory: true)
                  try? FileManager.default.createDirectory(at: folder, withIntermediateDirectories: true)
                  var d = AppData()
                  var existed = false
                  if let raw = try? Data(contentsOf: fileURL),
                     let decoded = try? JSONDecoder().decode(AppData.self, from: raw) {
                      d = decoded
                      existed = true
                  }
                  if existed { backup() }
                  syncStructure(&d)          // migración: deriva grupos/asignaturas de los datos previos
                  data = d
                  save()
              }

              private func save() {
                  let enc = JSONEncoder()
                  enc.outputFormatting = [.prettyPrinted]
                  if let d = try? enc.encode(data) { try? d.write(to: fileURL, options: .atomic) }
              }

              private func backup() {
                  let dir = folder.appendingPathComponent("Copias", isDirectory: true)
                  try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  let f = DateFormatter()
                  f.dateFormat = "yyyyMMdd-HHmmss"
                  try? FileManager.default.copyItem(at: fileURL, to: dir.appendingPathComponent("datos-\(f.string(from: Date())).json"))
                  if let files = try? FileManager.default.contentsOfDirectory(at: dir, includingPropertiesForKeys: nil)
                      .sorted(by: { $0.lastPathComponent < $1.lastPathComponent }), files.count > 30 {
                      for u in files.prefix(files.count - 30) { try? FileManager.default.removeItem(at: u) }
                  }
              }

              func name(_ id: UUID?) -> String {
                  data.teachers.first { $0.id == id }?.name ?? "—"
              }

              /// Grupos activos registrados + los que aparezcan en el horario (compatibilidad).
              var groups: [String] {
                  var names = data.groupList.filter(\.active).map(\.name)
                  for g in Set(data.lessons.map(\.group)) where !names.contains(where: { skey($0) == skey(g) }) { names.append(g) }
                  return names.sorted { $0.localizedStandardCompare($1) == .orderedAscending }
              }
          }
          EOF
          cat > Sources/HorariosEmergencia/Solver.swift <<'EOF'
          import Foundation

          enum Strategy: String, CaseIterable, Identifiable {
              case materia = "Misma asignatura"
              case equilibrio = "Carga equilibrada"
              case area = "Áreas afines"
              var id: String { rawValue }
          }

          struct Plan: Identifiable {
              let id = UUID()
              let strategy: Strategy
              var assignments: [Assignment]
              var uncovered: Int { assignments.filter { $0.coverTeacherID == nil }.count }
          }

          /// Reglas de bloqueo obligatorias:
          /// · Docente: solo se considera si el período está en estado "Disponible" y no tiene clase ni otra cobertura.
          ///   "Libre" y "Restringida" lo excluyen por completo.
          /// · Grupo: sus clases originales se conservan. Si no hay docente para cubrir una clase en su período,
          ///   se intenta moverla a otro período del grupo que esté "Disponible" y sin clase, sin crear horas libres
          ///   intermedias ni cruces. Los períodos "Libres" o "Restringidos" del grupo nunca se ocupan.
          func solve(_ data: AppData, day: Int, absent: Set<UUID>, strategy: Strategy) -> [Assignment] {
              let idx = data.availIndex
              let inactiveGroups = Set(data.groupList.filter { !$0.active }.map { skey($0.name) })
              let affected = data.lessons
                  .filter { $0.day == day && absent.contains($0.teacherID) && !inactiveGroups.contains(skey($0.group)) }
                  .sorted { $0.period != $1.period ? $0.period < $1.period : $0.group < $1.group }
              var busy = Set(data.lessons.filter { $0.day == day }.map { "\($0.teacherID)|\($0.period)" })
              var groupBusy: [String: Set<Int>] = [:]
              for l in data.lessons where l.day == day { groupBusy[skey(l.group), default: []].insert(l.period) }
              var load: [UUID: Int] = [:]
              let present = data.teachers.filter { !absent.contains($0.id) && $0.active }
              var taught: [UUID: Set<String>] = [:]
              for l in data.lessons { taught[l.teacherID, default: []].insert(skey(l.subject)) }
              for t in data.teachers { for s in t.subjectNames { taught[t.id, default: []].insert(skey(s)) } }
              let periodIDs = data.periods.map(\.id)

              func areaName(ofSubject s: String) -> String {
                  guard let id = data.subjectList.first(where: { skey($0.name) == skey(s) })?.areaID else { return "" }
                  return data.areaList.first { $0.id == id }?.name ?? ""
              }
              func areas(_ t: Teacher) -> Set<String> {
                  var r = Set(t.areaNames.map { skey($0) })
                  if !t.area.isEmpty { r.insert(skey(t.area)) }
                  for s in t.subjectNames { let a = areaName(ofSubject: s); if !a.isEmpty { r.insert(skey(a)) } }
                  return r
              }
              func rank(_ t: Teacher, _ l: Lesson) -> Int {
                  let lessonArea = skey(areaName(ofSubject: l.subject))
                  let absentArea = skey(data.teachers.first { $0.id == l.teacherID }?.area ?? "")
                  let teaches = taught[t.id]?.contains(skey(l.subject)) ?? false
                  let ta = areas(t)
                  let sameArea = (!lessonArea.isEmpty && ta.contains(lessonArea)) || (!absentArea.isEmpty && ta.contains(absentArea))
                  let ld = load[t.id] ?? 0
                  switch strategy {
                  case .materia:    return (teaches ? 0 : (sameArea ? 1 : 2)) * 100 + ld
                  case .equilibrio: return ld * 100 + (teaches ? 0 : (sameArea ? 1 : 2))
                  case .area:       return ((teaches || sameArea) ? 0 : 1) * 100 + ld
                  }
              }
              func teacherOK(_ t: Teacher, _ p: Int) -> Bool {
                  !busy.contains("\(t.id)|\(p)") && stateOf(idx, "T", t.id.uuidString, day, p) == .available
              }

              var result: [Assignment] = []
              for l in affected {
                  // 1) Cubrir la clase en su mismo período con un docente en hora disponible
                  let cands = present.filter { teacherOK($0, l.period) }
                  if let p = cands.min(by: { rank($0, l) < rank($1, l) }) {
                      busy.insert("\(p.id)|\(l.period)")
                      load[p.id, default: 0] += 1
                      result.append(Assignment(group: l.group, period: l.period, subject: l.subject,
                                               absentTeacherID: l.teacherID, coverTeacherID: p.id))
                      continue
                  }
                  // 2) Reorganizar: mover la clase a otro período habilitado del grupo
                  let gk = skey(l.group)
                  var moved = false
                  for q in periodIDs.sorted(by: { abs($0 - l.period) < abs($1 - l.period) }) where q != l.period {
                      let occ = groupBusy[gk] ?? []
                      guard !occ.contains(q), stateOf(idx, "G", gk, day, q) == .available else { continue }
                      var after = occ
                      after.remove(l.period)
                      after.insert(q)
                      guard let lo = after.min(), let hi = after.max(), hi - lo + 1 == after.count else { continue }
                      guard let p = present.filter({ teacherOK($0, q) }).min(by: { rank($0, l) < rank($1, l) }) else { continue }
                      busy.insert("\(p.id)|\(q)")
                      load[p.id, default: 0] += 1
                      groupBusy[gk] = after
                      result.append(Assignment(group: l.group, period: q, subject: l.subject,
                                               absentTeacherID: l.teacherID, coverTeacherID: p.id, fromPeriod: l.period))
                      moved = true
                      break
                  }
                  if !moved {
                      result.append(Assignment(group: l.group, period: l.period, subject: l.subject,
                                               absentTeacherID: l.teacherID, coverTeacherID: nil))
                  }
              }
              return result
          }

          /// Docentes asistentes, activos, en HORA DISPONIBLE y sin clase ni otra cobertura en ese período.
          func availableTeachers(_ data: AppData, day: Int, period: Int, absent: Set<UUID>,
                                 assignments: [Assignment], excluding: UUID) -> [Teacher] {
              let idx = data.availIndex
              return data.teachers.filter { t in
                  t.active && !absent.contains(t.id)
                  && stateOf(idx, "T", t.id.uuidString, day, period) == .available
                  && !data.lessons.contains { $0.day == day && $0.period == period && $0.teacherID == t.id }
                  && !assignments.contains { $0.id != excluding && $0.period == period && $0.coverTeacherID == t.id }
              }
          }
          EOF
          cat > Sources/HorariosEmergencia/Structure.swift <<'EOF'
          import SwiftUI

          // MARK: - Lógica de estructura (una sola base de datos: AppData)

          let seedStructureMap: [(String, [String])] = [
              ("Humanidades", ["Español", "Inglés", "Filosofía"]),
              ("Matemáticas", ["Matemáticas"]),
              ("Ciencias Naturales", ["Naturales", "Física", "Química", "Biología"]),
              ("Ciencias Sociales", ["Sociales", "Historia", "Geografía"]),
              ("Educación Física", ["Educación Física"]),
              ("Educación Artística", ["Artística"]),
              ("Tecnología e Informática", ["Tecnología", "Emprendimiento"]),
              ("Educación Ética y Valores", ["Ética"]),
              ("Educación Religiosa", ["Religión"])
          ]

          func gradeOf(_ name: String) -> String {
              let p = name.split(separator: "-")
              return p.count > 1 ? String(p[0]).trimmingCharacters(in: .whitespaces) : "Otros"
          }

          func seedStructure(_ d: inout AppData) {
              guard d.areaList.isEmpty && d.subjectList.isEmpty else { return }
              for (a, subs) in seedStructureMap {
                  let area = Area(name: a)
                  d.areaList.append(area)
                  for s in subs { d.subjectList.append(Subject(name: s, areaID: area.id)) }
              }
          }

          /// Crea (sin duplicar) los grupos y asignaturas que aparezcan en el horario, unifica nombres
          /// con los registrados y completa las asociaciones docente–asignatura–grupo–área.
          func syncStructure(_ d: inout AppData) {
              seedStructure(&d)
              // Migración: la antigua "no disponibilidad" de docentes pasa a HORA RESTRINGIDA.
              for t in d.teachers where !t.unavailable.isEmpty {
                  for k in t.unavailable {
                      let p = k.split(separator: "|").compactMap { Int($0) }
                      if p.count == 2, !d.availability.contains(where: { $0.kind == "T" && $0.owner == t.id.uuidString && $0.day == p[0] && $0.period == p[1] }) {
                          setAvail(&d, kind: "T", owner: t.id.uuidString, day: p[0], period: p[1], state: .restricted)
                      }
                  }
              }
              for i in d.teachers.indices { d.teachers[i].unavailable = [] }
              var subjectArea: [String: String] = [:]
              for (a, subs) in seedStructureMap { for s in subs { subjectArea[skey(s)] = a } }
              for i in d.lessons.indices {
                  let l = d.lessons[i]
                  if let g = d.groupList.first(where: { skey($0.name) == skey(l.group) }) {
                      d.lessons[i].group = g.name
                  } else {
                      d.groupList.append(SchoolGroup(name: l.group, grade: gradeOf(l.group)))
                  }
                  if let s = d.subjectList.first(where: { skey($0.name) == skey(l.subject) }) {
                      d.lessons[i].subject = s.name
                  } else {
                      let nm = l.subject.capitalized
                      let aid = subjectArea[skey(l.subject)].flatMap { an in d.areaList.first { skey($0.name) == skey(an) }?.id }
                      d.subjectList.append(Subject(name: nm, areaID: aid))
                      d.lessons[i].subject = nm
                  }
              }
              for ti in d.teachers.indices {
                  let id = d.teachers[ti].id
                  for l in d.lessons where l.teacherID == id {
                      if !d.teachers[ti].subjectNames.contains(where: { skey($0) == skey(l.subject) }) { d.teachers[ti].subjectNames.append(l.subject) }
                      if !d.teachers[ti].groupNames.contains(where: { skey($0) == skey(l.group) }) { d.teachers[ti].groupNames.append(l.group) }
                      if let aid = d.subjectList.first(where: { skey($0.name) == skey(l.subject) })?.areaID,
                         let an = d.areaList.first(where: { $0.id == aid })?.name,
                         !d.teachers[ti].areaNames.contains(where: { skey($0) == skey(an) }) { d.teachers[ti].areaNames.append(an) }
                  }
              }
          }

          /// Resumen de lo que el PDF trae y aún no está registrado (vacío = todo ya existe).
          func missingSummary(_ d: AppData, _ ls: [PLesson]) -> String {
              let gk = Set(d.groupList.map { skey($0.name) })
              let sk = Set(d.subjectList.map { skey($0.name) })
              let tk = Set(d.teachers.map { $0.name.lowercased() })
              var g = Set<String>(), s = Set<String>(), t = Set<String>()
              for l in ls {
                  if !gk.contains(skey(l.group)) { g.insert(l.group) }
                  if !sk.contains(skey(l.subject)) { s.insert(l.subject) }
                  if !tk.contains(l.teacher.lowercased()) { t.insert(l.teacher) }
              }
              var out: [String] = []
              if !g.isEmpty { out.append("Grupos nuevos (\(g.count)): " + g.sorted().prefix(10).joined(separator: ", ")) }
              if !s.isEmpty { out.append("Asignaturas nuevas (\(s.count)): " + s.sorted().prefix(10).joined(separator: ", ")) }
              if !t.isEmpty { out.append("Docentes nuevos (\(t.count)): " + t.sorted().prefix(10).joined(separator: ", ")) }
              return out.isEmpty ? "" : out.joined(separator: "\n") + "\n\n¿Crear estos registros e importar?"
          }

          struct LessonCheck {
              var errors: [String] = []
              var warnings: [String] = []
              var needsAuth = false
          }

          func validateLesson(_ d: AppData, _ l: Lesson, areaID: UUID?, authorized: Bool, ignoring: UUID?) -> LessonCheck {
              var c = LessonCheck()
              let idx = d.availIndex
              let unchanged = d.lessons.first(where: { $0.id == ignoring }).map {
                  $0.day == l.day && $0.period == l.period && $0.teacherID == l.teacherID && skey($0.group) == skey(l.group)
              } ?? false
              if l.group.isEmpty || l.subject.isEmpty || d.teachers.first(where: { $0.id == l.teacherID }) == nil {
                  c.errors.append("Seleccione grupo, asignatura y docente.")
                  return c
              }
              if let g = d.groupList.first(where: { skey($0.name) == skey(l.group) }) {
                  if !g.active { c.errors.append("El grupo \(g.name) está inactivo.") }
              } else { c.errors.append("El grupo no existe.") }
              if let s = d.subjectList.first(where: { skey($0.name) == skey(l.subject) }) {
                  if !s.active { c.errors.append("La asignatura está inactiva.") }
                  if let a = areaID, s.areaID != a { c.errors.append("La asignatura no pertenece al área seleccionada.") }
              } else { c.errors.append("La asignatura no está registrada.") }
              if let aid = areaID, let a = d.areaList.first(where: { $0.id == aid }), !a.active { c.errors.append("El área está inactiva.") }
              if let t = d.teachers.first(where: { $0.id == l.teacherID }) {
                  if !t.active { c.errors.append("El docente está inactivo.") }
                  if !t.subjectNames.contains(where: { skey($0) == skey(l.subject) }) {
                      if authorized { c.warnings.append("Asignación autorizada por coordinación (el docente no tiene registrada esta asignatura).") }
                      else { c.errors.append("\(t.name) no está habilitado para esta asignatura."); c.needsAuth = true }
                  }
                  if !unchanged {
                      switch stateOf(idx, "T", t.id.uuidString, l.day, l.period) {
                      case .free: c.errors.append("\(t.name) tiene este período como HORA LIBRE (conservada por coordinación). Cámbielo en «Configurar disponibilidad docente».")
                      case .restricted: c.errors.append("\(t.name) tiene este período como HORA RESTRINGIDA: no puede recibir clases.")
                      case .available: break
                      }
                  }
              }
              if !d.periods.contains(where: { $0.id == l.period }) { c.errors.append("El período no pertenece a la jornada configurada.") }
              if let o = d.lessons.first(where: { $0.id != ignoring && $0.day == l.day && $0.period == l.period && $0.teacherID == l.teacherID }) {
                  c.errors.append("Conflicto: el docente ya dicta \(o.subject) al grupo \(o.group) en ese período.")
              }
              if let o = d.lessons.first(where: { $0.id != ignoring && $0.day == l.day && $0.period == l.period && skey($0.group) == skey(l.group) }) {
                  let n = d.teachers.first { $0.id == o.teacherID }?.name ?? "—"
                  c.errors.append("Conflicto: el grupo ya tiene \(o.subject) con \(n) en ese período.")
              }
              if !unchanged {
                  switch stateOf(idx, "G", skey(l.group), l.day, l.period) {
                  case .free: c.errors.append("El grupo \(l.group) tiene este período como HORA LIBRE: no se puede ocupar con una clase.")
                  case .restricted: c.errors.append("El grupo \(l.group) tiene este período como HORA RESTRINGIDA: no se pueden programar clases.")
                  case .available: break
                  }
              }
              return c
          }

