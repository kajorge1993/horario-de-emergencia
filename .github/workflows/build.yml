          // MARK: - C. Docentes

          struct TeachersConfigView: View {
              @EnvironmentObject var store: Store
              @State private var sel: UUID?
              @State private var search = ""
              @State private var bulk = false
              @State private var msg = ""
              @State private var confirmDelete = false

              var idx: Int? { store.data.teachers.firstIndex { $0.id == sel } }
              func bulkAdd(_ text: String) {
                  var d = store.data
                  var n = 0
                  for line in text.split(whereSeparator: \.isNewline) {
                      let c = line.split(separator: ";", omittingEmptySubsequences: false).map { $0.trimmingCharacters(in: .whitespaces) }
                      guard let name = c.first, !name.isEmpty,
                            !d.teachers.contains(where: { $0.name.lowercased() == name.lowercased() }) else { continue }
                      var t = Teacher(name: name)
                      if c.count > 1 { t.internalID = c[1] }
                      if c.count > 2 { t.areaNames = c[2].split(separator: "|").map { $0.trimmingCharacters(in: .whitespaces) } }
                      if c.count > 3 { t.subjectNames = c[3].split(separator: "|").map { $0.trimmingCharacters(in: .whitespaces) } }
                      d.teachers.append(t); n += 1
                  }
                  store.data = d
                  msg = "\(n) docentes agregados."
              }
              func availBinding(_ i: Int, _ key: String) -> Binding<Bool> {
                  Binding(get: { i < store.data.teachers.count && !store.data.teachers[i].unavailable.contains(key) },
                          set: { on in
                              guard i < store.data.teachers.count else { return }
                              store.data.teachers[i].unavailable.removeAll { $0 == key }
                              if !on { store.data.teachers[i].unavailable.append(key) }
                          })
              }
              func areaBinding(_ i: Int, _ name: String) -> Binding<Bool> {
                  Binding(get: { i < store.data.teachers.count && store.data.teachers[i].areaNames.contains { skey($0) == skey(name) } },
                          set: { on in
                              guard i < store.data.teachers.count else { return }
                              store.data.teachers[i].areaNames.removeAll { skey($0) == skey(name) }
                              if on { store.data.teachers[i].areaNames.append(name) }
                          })
              }
              var body: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      Text("Configuración de docentes").font(.title.bold())
                      IndicatorsBar()
                      HStack(alignment: .top, spacing: 16) {
                          VStack(alignment: .leading) {
                              HStack {
                                  Button("Nuevo docente") {
                                      let t = Teacher(name: "Nuevo docente"); store.data.teachers.append(t); sel = t.id
                                  }
                                  Button("Carga masiva…") { bulk = true }
                              }
                              TextField("Buscar…", text: $search).textFieldStyle(.roundedBorder)
                              List(store.data.teachers.filter { search.isEmpty || $0.name.localizedCaseInsensitiveContains(search) },
                                   selection: $sel) { t in
                                  HStack { Text(t.name); Spacer(); if !t.active { Text("inactivo").font(.caption).foregroundStyle(.secondary) } }
                              }
                              Text(msg).font(.caption).foregroundStyle(.secondary)
                          }.frame(width: 300)
                          if let i = idx {
                              let t = store.data.teachers[i]
                              ScrollView {
                                  VStack(alignment: .leading, spacing: 10) {
                                      TextField("Nombre completo", text: $store.data.teachers[i].name)
                                      TextField("Identificación interna (opcional)", text: $store.data.teachers[i].internalID)
                                      Picker("Jornada", selection: $store.data.teachers[i].shift) {
                                          Text("AM").tag("AM"); Text("PM").tag("PM")
                                      }.pickerStyle(.segmented).frame(width: 200)
                                      Toggle("Activo", isOn: $store.data.teachers[i].active)
                                      Text("Áreas que puede orientar").font(.headline)
                                      ForEach(store.data.areaList.filter(\.active)) { a in Toggle(a.name, isOn: areaBinding(i, a.name)) }
                                      Text("Disponibilidad horaria (marcado = disponible)").font(.headline)
                                      Grid(alignment: .leading) {
                                          GridRow { Text(""); ForEach(dayNames, id: \.self) { Text($0).font(.caption) } }
                                          ForEach(store.data.periods) { p in
                                              GridRow {
                                                  Text("P\(p.id)").font(.caption)
                                                  ForEach(0..<5, id: \.self) { d in
                                                      Toggle("", isOn: availBinding(i, "\(d)|\(p.id)")).labelsHidden()
                                                  }
                                              }
                                          }
                                      }
                                      Text("Asignaturas: " + (t.subjectNames.isEmpty ? "—" : t.subjectNames.joined(separator: ", ")))
                                      Text("Grupos: " + (t.groupNames.isEmpty ? "—" : t.groupNames.sorted { $0.localizedStandardCompare($1) == .orderedAscending }.joined(separator: ", ")))
                                      Text("Se editan en «Docentes y asignaturas» y «Docentes y grupos».").font(.caption).foregroundStyle(.secondary)
                                      Button("Eliminar docente…", role: .destructive) { confirmDelete = true }
                                  }.frame(maxWidth: 520, alignment: .leading)
                              }
                          } else {
                              Text("Seleccione o cree un docente.").foregroundStyle(.secondary)
                          }
                      }
                  }
                  .padding(24)
                  .sheet(isPresented: $bulk) {
                      BulkSheet(title: "Carga masiva de docentes",
                                hint: "Una línea por docente: Nombre; ID; Área1|Área2; Asignatura1|Asignatura2 (solo el nombre es obligatorio).") { bulkAdd($0) }
                  }
                  .alert("Eliminar docente", isPresented: $confirmDelete) {
                      Button("Eliminar y borrar sus clases", role: .destructive) {
                          if let i = idx { let id = store.data.teachers[i].id
                              store.data.lessons.removeAll { $0.teacherID == id }
                              store.data.teachers.remove(at: i); sel = nil }
                      }
                      Button("Cancelar", role: .cancel) {}
                  } message: { Text("Si solo quiere retirarlo temporalmente, desmarque «Activo». Eliminarlo borra sus clases del horario.") }
              }
          }

          // MARK: - Asociaciones docente ↔ asignatura / grupo

          struct AssocView: View {
              let bySubject: Bool
              @EnvironmentObject var store: Store
              @State private var sel: UUID?
              @State private var search = ""

              func member(_ id: UUID, bySubject: Bool, _ name: String, area: String?) -> Binding<Bool> {
                  Binding(get: {
                      guard let t = store.data.teachers.first(where: { $0.id == id }) else { return false }
                      return (bySubject ? t.subjectNames : t.groupNames).contains { skey($0) == skey(name) }
                  }, set: { on in
                      guard let i = store.data.teachers.firstIndex(where: { $0.id == id }) else { return }
                      var t = store.data.teachers[i]
                      if bySubject {
                          t.subjectNames.removeAll { skey($0) == skey(name) }
                          if on { t.subjectNames.append(name)
                              if let a = area, !t.areaNames.contains(where: { skey($0) == skey(a) }) { t.areaNames.append(a) } }
                      } else {
                          t.groupNames.removeAll { skey($0) == skey(name) }
                          if on { t.groupNames.append(name) }
                      }
                      store.data.teachers[i] = t
                  })
              }
              var body: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      Text(bySubject ? "Asociación de docentes y asignaturas" : "Asociación de docentes y grupos").font(.title.bold())
                      IndicatorsBar()
                      HStack(alignment: .top, spacing: 16) {
                          VStack {
                              TextField("Buscar docente…", text: $search).textFieldStyle(.roundedBorder)
                              List(store.data.teachers.filter { $0.active && (search.isEmpty || $0.name.localizedCaseInsensitiveContains(search)) },
                                   selection: $sel) { Text($0.name) }
                          }.frame(width: 300)
                          if let id = sel, let t = store.data.teachers.first(where: { $0.id == id }) {
                              ScrollView {
                                  VStack(alignment: .leading, spacing: 6) {
                                      Text(t.name).font(.title2.bold())
                                      if bySubject {
                                          ForEach(store.data.areaList) { a in
                                              let subs = store.data.subjectList.filter { $0.areaID == a.id && $0.active }
                                              if !subs.isEmpty {
                                                  Text(a.name).font(.headline).padding(.top, 6)
                                                  ForEach(subs) { s in Toggle(s.name, isOn: member(id, bySubject: true, s.name, area: a.name)) }
                                              }
                                          }
                                          let loose = store.data.subjectList.filter { $0.areaID == nil && $0.active }
                                          if !loose.isEmpty {
                                              Text("Sin área").font(.headline).padding(.top, 6)
                                              ForEach(loose) { s in Toggle(s.name, isOn: member(id, bySubject: true, s.name, area: nil)) }
                                          }
                                      } else {
                                          let grades = Array(Set(store.data.groupList.filter(\.active).map { $0.effGrade }))
                                              .sorted { $0.localizedStandardCompare($1) == .orderedAscending }
                                          ForEach(grades, id: \.self) { g in
                                              Text("Grado \(g)").font(.headline).padding(.top, 6)
                                              ForEach(store.data.groupList.filter { $0.active && $0.effGrade == g }) { grp in
                                                  Toggle(grp.name, isOn: member(id, bySubject: false, grp.name, area: nil))
                                              }
                                          }
                                      }
                                  }.frame(maxWidth: 420, alignment: .leading)
                              }
                          } else {
                              Text("Seleccione un docente.").foregroundStyle(.secondary)
                          }
                      }
                  }.padding(24)
              }
          }
