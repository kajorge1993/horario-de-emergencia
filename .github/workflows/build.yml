                  .alert("Eliminar área", isPresented: Binding(get: { delID != nil }, set: { if !$0 { delID = nil } })) {
                      Button("Eliminar", role: .destructive) { if let id = delID { remove(id) }; delID = nil }
                      Button("Cancelar", role: .cancel) { delID = nil }
