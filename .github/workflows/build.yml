                              Text(a.name)
                              Text("\(count(a.id)) asignaturas").foregroundStyle(.secondary)
                              Spacer()
                              Button("Editar") { renaming = RenameTarget(id: a.id, name: a.name) }
                              Button(role: .destructive) {
