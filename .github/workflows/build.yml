          func makeAvailPDF(_ d: AppData, kind: String, owner: String, name: String) -> AvailPDFView {
              let idx = d.availIndex
              let key = kind == "T" ? owner : skey(owner)
              var rows: [[AvailCell]] = []
              for p in d.periods {
                  var row: [AvailCell] = []
                  for day in 0..<5 {
                      let st = stateOf(idx, kind, key, day, p.id)
                      var txt = ""
                      if kind == "T" {
                          if let l = d.lessons.first(where: { $0.teacherID.uuidString == owner && $0.day == day && $0.period == p.id }) { txt = "\(l.subject) · \(l.group)" }
                      } else if let l = d.lessons.first(where: { skey($0.group) == skey(owner) && $0.day == day && $0.period == p.id }) {
                          txt = "\(l.subject) · \(d.teachers.first { $0.id == l.teacherID }?.name ?? "—")"
                      }
                      row.append(AvailCell(text: txt, state: st))
                  }
                  rows.append(row)
              }
              return AvailPDFView(title: "Disponibilidad – \(name)",
                                  subtitle: (kind == "T" ? "Docente" : "Grupo") + " · generado el " + Date().formatted(date: .long, time: .omitted),
                                  periods: d.periods.map { "P\($0.id) \($0.time)" }, cells: rows)
