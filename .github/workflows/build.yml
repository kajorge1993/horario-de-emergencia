          // MARK: - Panel de disponibilidad con filtros

          enum PanelFilter: String, CaseIterable, Identifiable {
              case tAvail = "Docentes disponibles"
              case tFree = "Docentes con hora libre"
              case tRestr = "Docentes con hora restringida"
              case gAvail = "Grupos con hora disponible"
              case gFree = "Grupos con hora libre"
              case gRestr = "Grupos con hora restringida"
              var id: String { rawValue }
              var isTeacher: Bool { self == .tAvail || self == .tFree || self == .tRestr }
              var state: AvailState {
                  switch self {
                  case .tAvail, .gAvail: return .available
                  case .tFree, .gFree: return .free
                  default: return .restricted
                  }
              }
          }

          struct PanelRow: Identifiable { let id = UUID(); let name: String; let state: AvailState; let note: String }

          struct AvailabilityPanel: View {
              var fixedDay: Int? = nil
              var absent: Set<UUID> = []
              @EnvironmentObject var store: Store
              @State private var day = 0
              @State private var period = 1
              @State private var filter: PanelFilter = .tAvail

              var d: Int { fixedDay ?? day }
              func rows() -> [PanelRow] {
                  let idx = store.data.availIndex
                  let target = filter.state
                  if filter.isTeacher {
                      return store.data.teachers.filter { $0.active && !absent.contains($0.id) }.compactMap { t -> PanelRow? in
                          let st = stateOf(idx, "T", t.id.uuidString, d, period)
                          guard st == target else { return nil }
                          let cls = store.data.lessons.first { $0.teacherID == t.id && $0.day == d && $0.period == period }
                          if target == .available && cls != nil { return nil }
                          return PanelRow(name: t.name, state: st, note: cls.map { "con clase: \($0.subject) · \($0.group)" } ?? "sin clase")
                      }
                  }
                  return store.data.groupList.filter(\.active).sorted { $0.name.localizedStandardCompare($1.name) == .orderedAscending }.compactMap { g -> PanelRow? in
                      let st = stateOf(idx, "G", skey(g.name), d, period)
                      guard st == target else { return nil }
                      let cls = store.data.lessons.first { skey($0.group) == skey(g.name) && $0.day == d && $0.period == period }
                      if target == .available && cls != nil { return nil }
                      return PanelRow(name: g.name, state: st, note: cls.map { "con clase: \($0.subject)" } ?? "sin clase")
                  }
              }
