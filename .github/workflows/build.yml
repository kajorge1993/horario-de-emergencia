          struct GroupsConfigView: View {
              @EnvironmentObject var store: Store
              @State private var newName = ""
              @State private var msg = ""
              @State private var bulk = false
              @State private var renaming: RenameTarget?
              @State private var delID: UUID?

              var grades: [String] {
                  Array(Set(store.data.groupList.map { $0.effGrade })).sorted { $0.localizedStandardCompare($1) == .orderedAscending }
              }
              func count(_ n: String) -> Int { store.data.lessons.filter { skey($0.group) == skey(n) }.count }
              func addMany(_ names: [String]) -> Int {
                  var d = store.data
                  var n = 0
                  for raw in names {
                      let t = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                      if t.isEmpty || d.groupList.contains(where: { skey($0.name) == skey(t) }) { continue }
                      d.groupList.append(SchoolGroup(name: t, grade: gradeOf(t))); n += 1
                  }
                  store.data = d
                  return n
              }
              func addOne() {
                  let n = addMany([newName])
                  msg = n == 0 ? "Grupo vacío o ya existente." : ""
                  if n > 0 { newName = "" }
              }
              func activeBinding(_ id: UUID) -> Binding<Bool> {
                  Binding(get: { store.data.groupList.first { $0.id == id }?.active ?? false },
                          set: { v in if let i = store.data.groupList.firstIndex(where: { $0.id == id }) { store.data.groupList[i].active = v } })
              }
              func rename(_ id: UUID, _ new: String) {
                  var d = store.data
                  guard let i = d.groupList.firstIndex(where: { $0.id == id }) else { return }
                  if d.groupList.contains(where: { $0.id != id && skey($0.name) == skey(new) }) { msg = "Ya existe un grupo con ese nombre."; return }
                  let old = d.groupList[i].name
                  d.groupList[i].name = new
                  d.groupList[i].grade = gradeOf(new)
                  for j in d.availability.indices where d.availability[j].kind == "G" && d.availability[j].owner == skey(old) {
                      d.availability[j].owner = skey(new)
                  }
                  for j in d.lessons.indices where skey(d.lessons[j].group) == skey(old) { d.lessons[j].group = new }
                  for j in d.teachers.indices {
                      d.teachers[j].groupNames = d.teachers[j].groupNames.map { skey($0) == skey(old) ? new : $0 }
                  }
                  store.data = d
              }
              func remove(_ id: UUID) {
                  var d = store.data
                  guard let g = d.groupList.first(where: { $0.id == id }) else { return }
                  d.lessons.removeAll { skey($0.group) == skey(g.name) }
                  d.availability.removeAll { $0.kind == "G" && $0.owner == skey(g.name) }
                  for j in d.teachers.indices { d.teachers[j].groupNames.removeAll { skey($0) == skey(g.name) } }
                  d.groupList.removeAll { $0.id == id }
                  store.data = d
              }
              var body: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Text("Configuración de grupos").font(.title.bold())
                      IndicatorsBar()
                      HStack {
                          TextField("Nuevo grupo (ej. 6-1)", text: $newName).frame(width: 240).onSubmit { addOne() }
                          Button("Agregar") { addOne() }
                          Button("Carga masiva…") { bulk = true }
                          Text(msg).foregroundStyle(.orange)
                      }
                      List {
                          ForEach(grades, id: \.self) { g in
                              Section("Grado \(g)") {
                                  ForEach(store.data.groupList.filter { $0.effGrade == g }) { grp in
                                      HStack {
                                          Toggle("", isOn: activeBinding(grp.id)).labelsHidden()
                                          Text(grp.name).frame(width: 90, alignment: .leading)
                                          Text("\(count(grp.name)) clases").foregroundStyle(.secondary)
                                          Spacer()
                                          Button("Editar") { renaming = RenameTarget(id: grp.id, name: grp.name) }
                                          Button(role: .destructive) {
                                              if count(grp.name) > 0 { delID = grp.id } else { remove(grp.id) }
                                          } label: { Image(systemName: "trash") }
                                      }.opacity(grp.active ? 1 : 0.5)
                                  }
                              }
                          }
                      }
                  }
                  .padding(24)
                  .sheet(item: $renaming) { t in RenameSheet(title: "Editar grupo", initial: t.name) { rename(t.id, $0) } }
                  .sheet(isPresented: $bulk) {
                      BulkSheet(title: "Carga masiva de grupos", hint: "Un grupo por línea o separados por coma. Ej.: 6-1, 6-2, 7-1") {
                          let n = addMany($0.components(separatedBy: CharacterSet(charactersIn: ",;\n")))
                          msg = "\(n) grupos agregados (los repetidos se omiten)."
                      }
                  }
                  .alert("Eliminar grupo", isPresented: Binding(get: { delID != nil }, set: { if !$0 { delID = nil } })) {
                      Button("Eliminar grupo y sus clases", role: .destructive) { if let id = delID { remove(id) }; delID = nil }
                      Button("Cancelar", role: .cancel) { delID = nil }
                  } message: { Text("El grupo tiene clases asociadas en el horario institucional; se eliminarán también.") }
              }
          }

