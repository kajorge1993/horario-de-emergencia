              }
              func rename(_ id: UUID, _ new: String) {
                  var d = store.data
                  guard let i = d.areaList.firstIndex(where: { $0.id == id }) else { return }
                  if d.areaList.contains(where: { $0.id != id && skey($0.name) == skey(new) }) { msg = "Ya existe esa área."; return }
                  let old = d.areaList[i].name
                  d.areaList[i].name = new
                  for j in d.teachers.indices { d.teachers[j].areaNames = d.teachers[j].areaNames.map { skey($0) == skey(old) ? new : $0 } }
