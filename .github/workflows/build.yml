                          .background(Color.blue.opacity(0.18)).cornerRadius(5)
                  }
              }
          }

          func setBinding(_ s: Binding<Set<Int>>, _ v: Int) -> Binding<Bool> {
              Binding(get: { s.wrappedValue.contains(v) },
                      set: { if $0 { s.wrappedValue.insert(v) } else { s.wrappedValue.remove(v) } })
          }

