              @State private var sel = Set<UUID>()
              @State private var showEditor = false
              @State private var editTarget: Lesson?

              func areaName(_ subject: String) -> String {
                  guard let id = store.data.subjectList.first(where: { skey($0.name) == skey(subject) })?.areaID else { return "—" }
                  return store.data.areaList.first { $0.id == id }?.name ?? "—"
              }
              var body: some View {
                  VStack(alignment: .leading) {
                      HStack {
                          Text("Horario institucional").font(.title.bold())
                          Spacer()
                          Button("Agregar clase") { editTarget = nil; showEditor = true }
                          Button("Editar") {
                              if sel.count == 1, let l = store.data.lessons.first(where: { sel.contains($0.id) }) { editTarget = l; showEditor = true }
                          }.disabled(sel.count != 1)
                          Button("Eliminar") {
                              store.data.lessons.removeAll { sel.contains($0.id) }
                              sel = []
                          }.disabled(sel.isEmpty)
                      }
                      IndicatorsBar()
                      Table(store.data.lessons, selection: $sel) {
                          TableColumn("Grupo") { Text($0.group) }
                          TableColumn("Día") { Text(dayNames[$0.day]) }
                          TableColumn("Período") { Text("\($0.period)") }
                          TableColumn("Área") { Text(areaName($0.subject)) }
                          TableColumn("Asignatura") { Text($0.subject) }
                          TableColumn("Docente") { Text(store.name($0.teacherID)) }
                      }
                  }
                  .padding(24)
                  .sheet(isPresented: $showEditor) { LessonEditor(existing: editTarget) }
              }
          }

          struct LessonEditor: View {
              @EnvironmentObject var store: Store
              @Environment(\.dismiss) var dismiss
              let existing: Lesson?
              @State private var day: Int
              @State private var period: Int
              @State private var group: String
              @State private var areaID = ""
              @State private var subject: String
              @State private var teacherID: String
              @State private var authorized = false

              init(existing: Lesson?) {
                  self.existing = existing
                  _day = State(initialValue: existing?.day ?? 0)
                  _period = State(initialValue: existing?.period ?? 1)
                  _group = State(initialValue: existing?.group ?? "")
                  _subject = State(initialValue: existing?.subject ?? "")
                  _teacherID = State(initialValue: existing?.teacherID.uuidString ?? "")
              }

              var d: AppData { store.data }
              var groupOpts: [PickOpt] {
                  var names = d.groupList.filter(\.active).map(\.name)
                  if !group.isEmpty && !names.contains(group) { names.append(group) }
                  return names.sorted { $0.localizedStandardCompare($1) == .orderedAscending }.map { PickOpt(id: $0, label: $0) }
              }
              var areaOpts: [PickOpt] { [PickOpt(id: "", label: "— Todas las áreas —")] + d.areaList.filter(\.active).map { PickOpt(id: $0.id.uuidString, label: $0.name) } }
              var subjectOpts: [PickOpt] {
                  d.subjectList.filter { $0.active && (areaID.isEmpty || $0.areaID?.uuidString == areaID) }
                      .sorted { $0.name < $1.name }.map { PickOpt(id: $0.name, label: $0.name) }
              }
              var teacherOpts: [PickOpt] {
                  let act = d.teachers.filter(\.active)
                  let can = act.filter { t in t.subjectNames.contains { skey($0) == skey(subject) } }
                  let rest = act.filter { t in !can.contains(where: { $0.id == t.id }) }
                  return can.map { PickOpt(id: $0.id.uuidString, label: "★ " + $0.name) } + rest.map { PickOpt(id: $0.id.uuidString, label: $0.name) }
              }
              var candidate: Lesson {
                  Lesson(id: existing?.id ?? UUID(), group: group, day: day, period: period, subject: subject,
                         teacherID: UUID(uuidString: teacherID) ?? UUID())
              }
              var check: LessonCheck { validateLesson(d, candidate, areaID: UUID(uuidString: areaID), authorized: authorized, ignoring: existing?.id) }

              var body: some View {
                  let c = check
                  VStack(alignment: .leading, spacing: 10) {
                      Text(existing == nil ? "Nueva clase" : "Editar clase").font(.headline)
                      Picker("Día", selection: $day) { ForEach(0..<5, id: \.self) { Text(dayNames[$0]).tag($0) } }
                      Picker("Período", selection: $period) { ForEach(d.periods) { Text("Período \($0.id) · \($0.time)").tag($0.id) } }
                      SearchPick(title: "Grupo", options: groupOpts, selection: $group)
                      SearchPick(title: "Área", options: areaOpts, selection: $areaID)
                      SearchPick(title: "Asignatura", options: subjectOpts, selection: $subject)
                      SearchPick(title: "Docente", options: teacherOpts, selection: $teacherID)
                      if let t = d.teachers.first(where: { $0.id.uuidString == teacherID }) {
                          let gs = Set(t.groupNames + d.lessons.filter { $0.teacherID == t.id }.map(\.group))
                              .sorted { $0.localizedStandardCompare($1) == .orderedAscending }
                          Text("Grupos del docente: " + (gs.isEmpty ? "—" : gs.joined(separator: ", "))).font(.caption).foregroundStyle(.secondary)
                      }
                      Text("★ = docentes que tienen registrada la asignatura").font(.caption).foregroundStyle(.secondary)
                      if c.needsAuth || authorized { Toggle("Autorizado por coordinación", isOn: $authorized) }
                      ForEach(c.errors, id: \.self) { Label($0, systemImage: "xmark.octagon").foregroundStyle(.red).font(.caption) }
                      ForEach(c.warnings, id: \.self) { Label($0, systemImage: "exclamationmark.triangle").foregroundStyle(.orange).font(.caption) }
                      HStack {
                          Button("Cancelar") { dismiss() }
                          Button("Guardar") {
                              if let e = existing, let i = store.data.lessons.firstIndex(where: { $0.id == e.id }) { store.data.lessons[i] = candidate }
                              else { store.data.lessons.append(candidate) }
                              dismiss()
                          }.keyboardShortcut(.defaultAction).disabled(!c.errors.isEmpty)
                      }
                  }
                  .padding(24).frame(width: 470)
                  .onAppear {
                      if areaID.isEmpty, let s = d.subjectList.first(where: { skey($0.name) == skey(subject) }) { areaID = s.areaID?.uuidString ?? "" }
                  }
                  .onChange(of: areaID) {
                      if !subject.isEmpty && !subjectOpts.contains(where: { $0.id == subject }) { subject = "" }
                  }
                  .onChange(of: subject) {
                      if areaID.isEmpty, let s = d.subjectList.first(where: { $0.name == subject }) { areaID = s.areaID?.uuidString ?? "" }
                  }
              }
          }
          EOF
          cat > patch_estructura.py <<'EOF'
          import re, sys
          def sub(path, pat, rep, flags=0, lit=False):
              s = open(path, encoding="utf-8").read()
              if lit:
                  if pat not in s: sys.exit("PATCH FALLO en %s: %s" % (path, pat[:60]))
                  s = s.replace(pat, rep, 1)
              else:
                  s, n = re.subn(pat, rep if callable(rep) else (lambda m: rep), s, count=1, flags=flags)
                  if n == 0: sys.exit("PATCH FALLO en %s: %s" % (path, pat[:60]))
              open(path, "w", encoding="utf-8").write(s)

          V1 = "Sources/HorariosEmergencia/Views1.swift"
          V2 = "Sources/HorariosEmergencia/Views2.swift"
          # 1) Horario institucional antiguo -> reemplazado por Lessons.swift
          sub(V1, r"struct LessonsView: View \{.*?(?=struct ConfigView: View)", "", re.S)
          # 2) Importacion: no borrar docentes registrados, integrar estructura, alertar sobre lo nuevo
          sub(V1, '@State private var msg = ""',
              '@State private var msg = ""\n'
              '    @State private var showNew = false\n'
              '    var missingText: String { missingSummary(store.data, lessons) }\n'
              '    func askConfirm() { if missingSummary(store.data, lessons).isEmpty { confirm() } else { showNew = true } }', lit=True)
          sub(V1, 'Button("Confirmar e importar") { confirm() }', 'Button("Confirmar e importar") { askConfirm() }', lit=True)
          sub(V1, '.fileImporter(isPresented: $picking',
              '.alert("Registros no encontrados en la estructura", isPresented: $showNew) {\n'
              '                  Button("Crear registros e importar") { confirm() }\n'
              '                  Button("Cancelar", role: .cancel) {}\n'
              '              } message: { Text(missingText) }\n'
              '              .fileImporter(isPresented: $picking', lit=True)
          sub(V1, 'd.teachers = newTeachers',
              'for t in newTeachers { if let i = d.teachers.firstIndex(where: { $0.id == t.id }) { d.teachers[i] = t } else { d.teachers.append(t) } }', lit=True)
          sub(V1, r'store\.data = d\n(\s+)msg = "Importado',
              lambda m: 'syncStructure(&d)\n' + m.group(1) + 'store.data = d\n' + m.group(1) + 'msg = "Importado')
          sub(V1, r'store\.data = d\n(\s+)return "',
              lambda m: 'syncStructure(&d)\n' + m.group(1) + 'store.data = d\n' + m.group(1) + 'return "')
          # 3) Ausencias: solo docentes activos
          sub(V2, 'List(store.data.teachers, selection: $absent)', 'List(store.data.teachers.filter(\\.active), selection: $absent)', lit=True)
          print("Parches aplicados")
          EOF
          python3 patch_estructura.py
