          import SwiftUI

          // MARK: - Lógica de estados de período (docentes y grupos)

          func availKey(_ kind: String, _ owner: String, _ day: Int, _ period: Int) -> String { "\(kind)|\(owner)|\(day)|\(period)" }

          /// Sin configuración explícita, un período es "Disponible".
          func stateOf(_ idx: [String: AvailState], _ kind: String, _ owner: String, _ day: Int, _ period: Int) -> AvailState {
              idx[availKey(kind, owner, day, period)] ?? .available
          }

          extension AppData {
              var availIndex: [String: AvailState] {
                  var m: [String: AvailState] = [:]
                  for e in availability { m[availKey(e.kind, e.owner, e.day, e.period)] = e.state }
                  return m
              }
          }

          func setAvail(_ d: inout AppData, kind: String, owner: String, day: Int, period: Int, state: AvailState) {
              let now = Date()
              if let i = d.availability.firstIndex(where: { $0.kind == kind && $0.owner == owner && $0.day == day && $0.period == period }) {
                  d.availability[i].state = state
                  d.availability[i].modified = now
              } else {
                  d.availability.append(AvailEntry(kind: kind, owner: owner, day: day, period: period, state: state, modified: now))
              }
          }

          /// Docentes que NO pueden participar en ese período por su estado (libre o restringido).
          func blockedTeachers(_ d: AppData, day: Int, period: Int, absent: Set<UUID>) -> [String] {
              let idx = d.availIndex
              var out: [String] = []
              for t in d.teachers where t.active && !absent.contains(t.id) {
                  if d.lessons.contains(where: { $0.day == day && $0.period == period && $0.teacherID == t.id }) { continue }
                  switch stateOf(idx, "T", t.id.uuidString, day, period) {
                  case .free: out.append("\(t.name) (hora libre)")
                  case .restricted: out.append("\(t.name) (restringida)")
                  case .available: break
                  }
              }
              return out
          }

          func uncoveredReason(_ d: AppData, day: Int, period: Int, absent: Set<UUID>, assignments: [Assignment]) -> String {
              let idx = d.availIndex
              var busy = 0, free = 0, restr = 0, total = 0
              for t in d.teachers where t.active && !absent.contains(t.id) {
                  total += 1
                  let hasClass = d.lessons.contains { $0.day == day && $0.period == period && $0.teacherID == t.id }
                  let covering = assignments.contains { $0.period == period && $0.coverTeacherID == t.id }
                  if hasClass || covering { busy += 1; continue }
                  switch stateOf(idx, "T", t.id.uuidString, day, period) {
                  case .free: free += 1
                  case .restricted: restr += 1
                  case .available: break
                  }
              }
              return "Sin cobertura en P\(period): de \(total) docentes asistentes, \(busy) tienen clase o cobertura, \(free) tienen hora libre y \(restr) hora restringida. El grupo tampoco tiene otro período habilitado donde mover la clase."
          }

          // MARK: - Colores y leyenda uniformes

          extension AvailState {
              var color: Color {
                  switch self {
                  case .available: return .green
                  case .free: return .gray
                  case .restricted: return .red
                  }
              }
          }

