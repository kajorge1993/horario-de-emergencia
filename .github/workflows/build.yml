                  VStack(alignment: .leading, spacing: 10) {
                      Text(isT ? "Configurar disponibilidad docente" : "Configurar disponibilidad de grupos").font(.title.bold())
                      AvailLegend()
                      SearchPick(title: isT ? "Docente" : "Grupo", options: options, selection: $sel)
                      if sel.isEmpty {
                          Text("Seleccione \(isT ? "un docente" : "un grupo") para ver y configurar su horario semanal.").foregroundStyle(.secondary)
                      } else {
                          let all = (0..<5).flatMap { d in store.data.periods.map { stateOf(idx, kind, ownerKey, d, $0.id) } }
                          Text("Disponibles: \(all.filter { $0 == .available }.count) · Libres: \(all.filter { $0 == .free }.count) · Restringidas: \(all.filter { $0 == .restricted }.count)")
                              .font(.caption).foregroundStyle(.secondary)
                          ScrollView([.horizontal, .vertical]) {
                              VStack(alignment: .leading, spacing: 14) {
                                  Grid(alignment: .topLeading, horizontalSpacing: 6, verticalSpacing: 6) {
                                      GridRow { Text(""); ForEach(0..<5, id: \.self) { Text(dayNames[$0]).font(.caption.bold()) } }
                                      ForEach(store.data.periods) { p in
                                          GridRow {
                                              Text("P\(p.id)\n\(p.time)").font(.caption2)
                                              ForEach(0..<5, id: \.self) { d in cell(d, p, idx) }
                                          }
                                      }
                                  }
                                  Text("Las clases ya programadas se conservan; el estado solo controla nuevas asignaciones.")
                                      .font(.caption).foregroundStyle(.secondary)
                                  GroupBox("Cambios masivos") {
                                      VStack(alignment: .leading, spacing: 8) {
                                          Picker("Estado", selection: $bulkState) {
                                              ForEach(AvailState.allCases) { Text($0.rawValue).tag($0) }
                                          }.pickerStyle(.segmented).frame(width: 360)
                                          HStack {
                                              Text("Días:")
                                              ForEach(0..<5, id: \.self) { d in Toggle(String(dayNames[d].prefix(3)), isOn: setBinding($days, d)) }
                                              Button("Todos") { days = Set(0..<5) }
                                          }
                                          HStack {
                                              Text("Períodos:")
                                              ForEach(store.data.periods) { p in Toggle("P\(p.id)", isOn: setBinding($periodsSel, p.id)) }
                                              Button("Todos") { periodsSel = Set(store.data.periods.map(\.id)) }
                                          }
                                          Button("Aplicar a la selección…") { applyBulk() }.disabled(days.isEmpty || periodsSel.isEmpty)
                                          Divider()
                                          HStack {
                                              Picker("Copiar día", selection: $fromDay) { ForEach(0..<5, id: \.self) { Text(dayNames[$0]).tag($0) } }.frame(width: 230)
                                              Picker("a", selection: $toDay) { ForEach(0..<5, id: \.self) { Text(dayNames[$0]).tag($0) } }.frame(width: 190)
                                              Button("Copiar día…") { copyDay() }.disabled(fromDay == toDay)
